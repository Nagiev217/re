name: Build Plugin and ResourcePack

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package -B -f pom.xml

      - name: Zip ResourcePack
        run: cd resourcepack && zip -r ../MainMenuResourcePack.zip .

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MainMenuPlugin
          path: target/mainmenuplugin-*.jar

      - name: Upload ResourcePack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MainMenuResourcePack
          path: MainMenuResourcePack.zip
